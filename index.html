<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One in a Hundred</title>
<meta name="description" content="What it takes to be in the top 1%, top 10% or the median of any group, on income, height, weight, age and more. Every number graded and sourced.">
<meta property="og:title" content="One in a Hundred">
<meta property="og:description" content="What it takes to be in the top 1% of any group. Every number graded and sourced.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="assets/ledger.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="wrap">
  <p class="kicker"><a href="./">One in a Hundred</a></p>

  <section id="controls" aria-label="Choose a measure and a group">
    <div class="row">
      <label for="sel-metric">Measure</label>
      <select id="sel-metric"></select>
    </div>
    <div class="row" id="row-group">
      <label for="sel-country">Group</label>
      <div class="selects">
        <select id="sel-country" aria-label="Country"></select>
        <select id="sel-sex" aria-label="Sex"></select>
        <select id="sel-age" aria-label="Age"></select>
        <select id="sel-cat" aria-label="Category as published by the source" hidden></select>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Show</span>
      <div class="seg" id="pct-seg" role="group" aria-label="Percentile"></div>
    </div>
  </section>

  <section id="answer" aria-live="polite">
    <h1 id="punchline" class="punchline skeleton skeleton--title"></h1>
    <p id="subline" class="subline"></p>
    <div id="panel" class="panel" hidden></div>
    <form id="land-form" class="land" hidden>
      <label for="v" id="v-label">Your value</label>
      <input id="v" name="v" type="text" inputmode="decimal" autocomplete="off">
      <button class="btn" type="submit">Place me</button>
      <span id="land-out" class="land-out"></span>
    </form>
  </section>

  <section id="ask" aria-labelledby="ask-h">
    <form id="ask-form">
      <label for="q" id="ask-h">Or ask in words</label>
      <div class="ask-row">
        <input id="q" name="q" type="text" maxlength="300" autocomplete="off" placeholder="how tall is the top 1% of Dutch men">
        <button class="btn" type="submit">Ask</button>
      </div>
      <p id="ask-note" class="small" hidden></p>
    </form>
  </section>

  <section id="queue" class="callout" hidden>
    <b>No data for that yet.</b> <span id="queue-text"></span>
    <span id="queue-near" class="small"></span>
  </section>

  <section class="actions">
    <button class="btn" id="btn-surprise">Surprise me</button>
    <button class="btn" id="btn-link">Copy link</button>
    <a class="btn" id="btn-card" href="#" download>Download card</a>
  </section>
</main>

<footer class="wrap site-footer">
  <p><a href="overview/">How this works</a> · <a href="sources/">Sources</a> · <a href="about/">About</a> · <a href="privacy/">Privacy</a> · <a href="terms/">Terms</a></p>
  <p>Built by <a href="about/">Jeremy Lee</a>. Data built <span id="built"></span>. Numbers can be wrong; the grade says how likely.</p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
