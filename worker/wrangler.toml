name = "one-in-a-hundred"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secrets (set with `wrangler secret put`): GROQ_API_KEY
# Bindings: QUEUE (KV namespace). Create with `wrangler kv namespace create QUEUE`
# and paste the id below.

[vars]
ALLOWED_ORIGIN = "https://lyhjeremy.github.io"
GROQ_MODEL = "llama-3.1-8b-instant"
GROQ_RESEARCH_MODEL = "groq/compound-mini"
VERSION = "0.1.0"

[[kv_namespaces]]
binding = "QUEUE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Rate limiting binding (verify availability on the free plan at deploy time;
# the code degrades to no per-IP limit if the binding is absent).
[[unsafe.bindings]]
name = "PARSE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 600 }
